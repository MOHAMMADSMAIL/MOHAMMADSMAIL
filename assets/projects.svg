  <text x="450" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#2e1c0f" text-anchor="middle" letter-spacing="3">FEATURED PROJECTS</text>
  <line x1="230" y1="135" x2="670" y2="135" stroke="#5a3d21" stroke-width="2"/>

  <text x="70" y="195" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2e1c0f">Weather Intelligence Platform</text>
  <text x="70" y="224" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">React + FastAPI + SQLite — Full-stack weather app with real-time APIs,</text>
  <text x="70" y="246" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">CRUD operations, multi-format export, and AI-powered recommendations.</text>

  <line x1="70" y1="272" x2="830" y2="272" stroke="#a8895c" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="70" y="318" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2e1c0f">ML Classification Tool: From Scratch</text>
  <text x="70" y="347" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">Python + NumPy — KNN, Naive Bayes &amp; Decision Trees built from first</text>
  <text x="70" y="369" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">principles, with no black-box libraries. Full evaluation pipeline included.</text>

  <line x1="70" y1="395" x2="830" y2="395" stroke="#a8895c" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="70" y="440" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2e1c0f">Weather Trend Forecasting</text>
  <text x="70" y="469" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">Python + SARIMA + Scikit-learn — Compared SARIMA vs. Random Forest</text>
  <text x="70" y="491" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">for temperature prediction (RMSE 2.87 vs 14.48). Includes anomaly detection.</text>

  <line x1="70" y1="517" x2="830" y2="517" stroke="#a8895c" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="70" y="562" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2e1c0f">Employee Management System + AI</text>
  <text x="70" y="591" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">Java + Design Patterns — OOP system with Performance Analyzer,</text>
  <text x="70" y="613" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">Recommendation Engine &amp; Salary Predictor using multi-factor analysis.</text>

  <line x1="70" y1="639" x2="830" y2="639" stroke="#a8895c" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="70" y="684" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2e1c0f">Arabic Language NLP Model</text>
  <text x="70" y="713" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">Python — ML model simulating human-like responses in Arabic</text>
  <text x="70" y="735" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#4a3420">(Levantine dialect), with full training and linguistic evaluation framework.</text>

  <text x="450" y="800" font-family="Georgia, serif" font-size="14" fill="#6b4a28" text-anchor="middle" font-style="italic">~ view repositories below for full source code ~</text>
